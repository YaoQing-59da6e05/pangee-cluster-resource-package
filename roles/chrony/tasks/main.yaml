- name: Create directories
  file:
    path: "{{ item.path }}"
    mode: "{{ item.mode | default(omit) }}"
    state: "{{ item.state | default('directory') }}"
  loop: "{{ dir_list }}"
  when: dir_list is defined

- name: Install
  shell: "{{ item }}"
  loop: "{{ start_command }}"
  environment:
    PATH: "{{ root_dir }}/usr/bin:{{ ansible_env.PATH }}"
  loop_control:
    label: "{{ item }}"
  when: start_command is defined

- name: Copy template
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default(omit) }}"
  loop: "{{ templates }}"
  when: templates is defined

- name: After install
  shell: "{{ item }}"
  environment:
    PATH: "{{ root_dir }}/usr/bin:{{ ansible_env.PATH }}"
  loop: "{{ after_install }}"
  loop_control:
    label: "{{ item }}"
  when: after_install is defined

- name: Check application
  shell: "{{ item }}"
  environment:
    PATH: "{{ root_dir }}/usr/bin:{{ ansible_env.PATH }}"
  loop: "{{ check_app }}"
  loop_control:
    label: "{{ item }}"
  when: check_app is defined
  register: result
  until: result.rc == 0
  retries: "{{ check_app_retries | default('30') | int }}"
  delay: "{{ check_app_delay | default('1') | int }}"
