- name: set fact
  set_fact:
    "{{ item.var }}": "{{ item.value }}"
  loop: "{{ set_facts }}"
  when: set_facts is defined

- name: Create directories
  file:
    path: "{{ item.path }}"
    mode: "{{ item.mode | default(omit) }}"
    state: "{{ item.state | default('directory') }}"
  loop: "{{ dir_list }}"
  when: dir_list is defined

- name: Copy files
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default(omit) }}"
  loop: "{{ copy_list }}"
  when: copy_list is defined

- name: Install
  shell: "{{ item }}"
  environment:
    PATH: "{{ root_dir }}/usr/bin:{{ ansible_env.PATH }}"
  loop: "{{ start_command }}"
  loop_control:
    label: "{{ item }}"
  when: start_command is defined

- name: Set sysctl.conf
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: yes
    state: present
    reload: yes
  loop: "{{ kernel_option }}"
  loop_control:
    label: "{{ item.name }}"
  when: kernel_option is defined

- name: Set limits.conf
  pam_limits:
    dest: "{{ item.dest }}"
    domain: "{{ item.domain }}"
    limit_type: "{{ item.limit_type }}"
    limit_item: "{{ item.limit_item }}"
    value: "{{ item.value }}"
  loop: "{{ limits_list }}"
  when: limits_list is defined

- name: Line in file
  lineinfile:
    dest: "{{ item.file }}"
    regexp: "{{ item.regexp | default('___impossible_pattern___') }}"
    line: "{{ item.line | default(None) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ line_list }}"
  when: line_list is defined

- name: Block in file
  blockinfile:
    path: "{{ item.file }}"
    marker: "{{ item.marker }}"
    block: "{{ item.block }}"
  loop: "{{ block_list }}"
  when: block_list is defined
