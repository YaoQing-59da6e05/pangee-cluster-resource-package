- name: set fact
  set_fact:
    "{{ item.var }}": "{{ item.value }}"
  loop: "{{ set_facts }}"
  when: set_facts is defined

- name: Install
  shell: "{{ item }}"
  environment:
    PATH: "{{ root_dir }}/usr/bin:{{ ansible_env.PATH }}"
  loop: "{{ start_command }}"
  loop_control:
    label: "{{ item }}"
  when: start_command is defined
